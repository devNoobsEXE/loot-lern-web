		<title>Loot & Lern</title>
		<!--
			Eigene Startseite statt der Godot-Vorlage (Till, 2026-11-17: der Katzenkopf im Ladebildschirm war verpixelt, der Balken unpassend).
			Der Katzenkopf ist eine Vektorgrafik (bleibt auf jedem Bildschirm scharf, die frühere PNG wurde hochgezogen). Der Balken ist ein
			Wollfaden mit Pfote. Die Platzhalter ($GODOT_...) füllt der Godot-Export; sie dürfen nicht umbenannt werden.
			Dieser Ordner (game/web) landet nicht in der Spieldatei: Dateien ohne Godot-Ressource werden nur mit include_filter mitgenommen.
		-->
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

/* Seitenhintergrund = dunkle Löschfarbe der App (project.godot default_clear_color), damit ein Streifen, den das Bild nicht abdeckt,
   nicht auffällt (Till, 2026-11-18: "unten ist ein grüner Streifen"). Die grüne Fläche gehört nur zur Lade-Ansicht (#status). */
html {
	background-color: #120d17;
}

body {
	color: white;
	background-color: #120d17;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Lade-Ansicht: gleicher Grünton wie der Start-Hintergrund der App, damit beim Übergang nichts blitzt. */
#status {
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: 0;
	background-color: #8dbf9a;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 28px;
	visibility: hidden;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
}

#status-cat {
	width: min(56vw, 46vh, 300px);
	height: auto;
	display: block;
	filter: drop-shadow(0 6px 0 rgba(45, 42, 95, 0.12));
}

/* Die Augen blinzeln ab und zu. */
.blink {
	transform-box: fill-box;
	transform-origin: center;
	animation: blink 4.2s infinite;
}
@keyframes blink {
	0%, 92%, 100% { transform: scaleY(1); }
	95% { transform: scaleY(0.08); }
}

#status-bar {
	display: none;
	position: relative;
	width: min(62vw, 320px);
	height: 16px;
	border-radius: 8px;
	background: rgba(255, 255, 255, 0.5);
	box-shadow: inset 0 0 0 3px #2d2a5f;
}

/* Der Faden: orange mit hellen Wickelstrichen wie bei einem Wollknäuel. */
#status-fill {
	position: absolute;
	left: 3px;
	top: 3px;
	bottom: 3px;
	width: 0;
	min-width: 10px;
	max-width: calc(100% - 6px);
	border-radius: 5px;
	background: repeating-linear-gradient(115deg, #f58a4f 0 7px, #ff9f6e 7px 11px);
	transition: width 0.25s ease-out;
}

#status-paw {
	position: absolute;
	top: 50%;
	left: 0;
	width: 30px;
	height: 30px;
	margin: -15px 0 0 -15px;
	transition: left 0.25s ease-out;
	animation: tap 0.9s infinite ease-in-out;
}
@keyframes tap {
	0%, 100% { transform: translateY(0) rotate(-8deg); }
	50% { transform: translateY(-3px) rotate(8deg); }
}

/* Ohne bekannte Gesamtgröße (selten) pendelt die Pfote stattdessen hin und her. */
#status-bar.unknown #status-fill { display: none; }
#status-bar.unknown #status-paw { animation: wander 1.6s infinite ease-in-out alternate; }
@keyframes wander {
	from { left: 8%; }
	to { left: 92%; }
}

#status-text {
	display: none;
	color: #2d2a5f;
	font-size: 15px;
	letter-spacing: 0.04em;
	opacity: 0.75;
	margin-top: -10px;
}

#status-notice {
	display: none;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

@media (prefers-reduced-motion: reduce) {
	.blink, #status-paw, #status-bar.unknown #status-paw { animation: none; }
	#status-fill, #status-paw { transition: none; }
}

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":923920,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusBar = document.getElementById('status-bar');
	const statusFill = document.getElementById('status-fill');
	const statusPaw = document.getElementById('status-paw');
	const statusText = document.getElementById('status-text');
	const statusCat = document.getElementById('status-cat');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusBar.style.display = mode === 'progress' ? 'block' : 'none';
		statusText.style.display = mode === 'progress' ? 'block' : 'none';
		statusCat.style.display = mode === 'notice' ? 'none' : 'block';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');

		setStatusMode('notice');
		initializing = false;

			Promise.race([

				// For some reason, `getRegistration()` can stall

			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const share = Math.min(1, current / total);
					statusBar.classList.remove('unknown');
					statusFill.style.width = (share * 100) + '%';
					// Die Pfote sitzt am Ende des Fadens (innerhalb des Balkens, 3 px Rand).
					statusPaw.style.left = 'calc(3px + (100% - 6px) * ' + share + ')';
				} else {
					statusBar.classList.add('unknown');
					statusPaw.style.left = '';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
